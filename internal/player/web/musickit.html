<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>vibez</title>
  <!--
    Shared MusicKit JS page used by both the WebKit and Chrome (CDP) backends.

    MODE DETECTION at runtime:
      CHROME MODE  — goStreamURL is NOT bound; MusicKit plays natively through
                     Chrome + Widevine (full DRM tracks, direct audio output).
      GSTREAMER MODE — goStreamURL IS bound; MusicKit is auth+API only; preview
                     URLs are sent to Go's GStreamer pipeline for audio output.

    Go ↔ JS bridge:
      Go → JS : page.Evaluate for vibez*() commands
      JS → Go : goNeedsAuth, goAuthComplete, goPlayerStateChange,
                goUserTokenChanged, goStorefrontChanged, goStreamURL*, goError,
                goSkipped (* GStreamer mode only for goStreamURL)

    IMPORTANT: the musickitloaded listener MUST be registered before the
    musickit.js <script> tag — MusicKit dispatches the event synchronously
    during its own script execution, before any <body> scripts run.
  -->
  <script>
  document.addEventListener('musickitloaded', async function() {
    try {
      const configOpts = {
        developerToken: '{{.DeveloperToken}}',
        app: { name: 'vibez', build: '{{.Version}}' },
      };
      // Do NOT pass storefrontId from config here. If the config still has the
      // default "us" value for a non-US account, forcing it overrides MusicKit's
      // auto-detection and causes CONTENT_EQUIVALENT for every non-US track.
      // MusicKit derives the correct storefront from the user token automatically.
      const music = await MusicKit.configure(configOpts);

      // Lift MusicKit's client-side explicit-content filter.
      //
      // MusicKit keeps a `restrictedEnabled` flag, and with no stored preference
      // it guesses one from the storefront country alone: br, ch, gt, hu, id,
      // in, it, kr, la, lt, my, ru, sg and tr are restricted by default. vibez
      // drives Chrome with an ephemeral profile, so that storage is empty on
      // every launch and the guess is made afresh every time. Each setQueue then
      // copies the flag onto the queue, whose setter drops every explicit item
      // and raises CONTENT_RESTRICTED once the queue is left empty. vibez reads
      // that as an unavailable track and skips it without a word, so an explicit
      // track is unplayable in those storefronts (#130).
      //
      // Assigning the property routes to storekit.overrideRestrictEnabled(),
      // which latches the value so the country guess cannot re-derive it. Apple
      // still enforces genuine account restrictions server-side; dropping the
      // guess only stops vibez filtering on a value it cannot confirm and gives
      // the user no way to change.
      //
      // This must run before musicUserToken is set below. Applying the token
      // calls runTokenValidations, which reads the same flag and would leave
      // authorizationStatus at RESTRICTED for the storefronts above.
      //
      // The property this replaces, `isExplicitContentAllowed`, does not exist
      // in MusicKit v3. Guarding it with `in` meant the assignment never ran and
      // nothing was ever lifted.
      try { music.restrictedEnabled = false; } catch(_) {}

      function resolveAudioBitrate(kbps) {
        const n = Number(kbps);
        if (n === 64) return (MusicKit.PlaybackBitrate && MusicKit.PlaybackBitrate.STANDARD) || 64;
        if (n === 256) return (MusicKit.PlaybackBitrate && MusicKit.PlaybackBitrate.HIGH) || 256;
        throw new Error('MusicKit JS/web playback max is 256 kbps AAC; supported values are 64 and 256 kbps AAC');
      }

      function applyAudioBitrate(kbps) {
        music.bitrate = resolveAudioBitrate(kbps);
      }

      try { applyAudioBitrate({{.AudioBitrateKbps}}); } catch(e) { goError(e.message || String(e)).catch(() => {}); }

      // isAuthError returns true when an error indicates an expired/invalid token.
      const isAuthError = (e) => {
        if (!e) return false;
        const s = (errName(e) + ' ' + String(e.status || '')).toLowerCase();
        return s.includes('authorization') || s.includes('not authorized') ||
               s.includes('unauthorized')  || s.includes('401') ||
               s.includes('expired token');
      };

      const savedToken = '{{.UserToken}}';
      if (savedToken !== '') {
        try {
          music.musicUserToken = savedToken;
        } catch(e) {
          if (isAuthError(e)) {
            await goNeedsAuth('expired').catch(() => {});
            return;
          }
          throw e;
        }
      }

      // ── Runtime mode detection ───────────────────────────────────────────
      // goStreamURL is only bound in GStreamer (WebKit fallback) mode.
      // In Chrome mode it is absent and MusicKit plays natively.
      const GSTREAMER_MODE = typeof goStreamURL === 'function';

      // errName extracts a human-readable description from MusicKit errors.
      const errName = (e) => {
        if (!e) return '';
        const name = (typeof e.name === 'string' && e.name) ? e.name : '';
        const msg  = (typeof e.message === 'string' && e.message) ? e.message : '';
        if (name && msg && name !== 'Error') return name + ': ' + msg;
        return msg || name || String(e);
      };

      // ── State notification ───────────────────────────────────────────────
      function notifyStateFromItem(item, isPlaying) {
        if (!item) return;
        const artwork = item.attributes.artwork;
        const state = {
          isPlaying:     isPlaying,
          playbackState: isPlaying ? 3 : 2,
          currentTime:   0,
          duration:      (item.attributes.durationInMillis || 0) / 1000,
          volume:        1.0,
          nowPlaying: {
            id:         item.id,
            catalogId:  item.attributes.playParams?.catalogId || '',
            title:      item.attributes.name,
            artist:     item.attributes.artistName,
            album:      item.attributes.albumName,
            artworkURL: artwork ? MusicKit.formatArtworkURL(artwork, 300, 300) : '',
            durationMs: item.attributes.durationInMillis || 0,
          },
        };
        goPlayerStateChange(JSON.stringify(state)).catch(console.error);
      }

      // ── Token / storefront forwarding (both modes) ───────────────────────
      music.addEventListener('userTokenDidChange', function() {
        goUserTokenChanged(MusicKit.getInstance().musicUserToken || '').catch(console.error);
      });
      music.addEventListener('storefrontIdentifierDidChange', function() {
        goStorefrontChanged(MusicKit.getInstance().storefrontId || '').catch(console.error);
      });
      // Detect token expiry: MusicKit fires this when it invalidates the session.
      music.addEventListener('authorizationStatusDidChange', async function() {
        if (savedToken !== '' && !MusicKit.getInstance().isAuthorized) {
          await goNeedsAuth('expired').catch(() => {});
        }
      });

      // ════════════════════════════════════════════════════════════════════
      // CHROME MODE — MusicKit plays natively; we just mirror state to Go.
      // ════════════════════════════════════════════════════════════════════
      if (!GSTREAMER_MODE) {
        const _m = () => MusicKit.getInstance();

        // Update the W3C MediaSession so OS notifications / MPRIS show the
        // current track under the "vibez" player identity.
        function updateMediaSession(item, isPlaying) {
          if (item) {
            const artwork = item.attributes.artwork;
            navigator.mediaSession.metadata = new MediaMetadata({
              title:  item.attributes.name,
              artist: item.attributes.artistName,
              album:  item.attributes.albumName,
              artwork: artwork
                ? [{ src: MusicKit.formatArtworkURL(artwork, 512, 512), sizes: '512x512', type: 'image/jpeg' }]
                : [],
            });
          } else {
            navigator.mediaSession.metadata = null;
          }
          navigator.mediaSession.playbackState = isPlaying ? 'playing' : 'paused';
        }

        let _lastStateJSON = '';
        function notifyState() {
          const m = _m();
          const item = m.nowPlayingItem;
          updateMediaSession(item, m.isPlaying);
          const state = {
            isPlaying:     m.isPlaying,
            playbackState: m.playbackState,
            currentTime:   m.currentPlaybackTime,
            duration:      m.currentPlaybackDuration,
            volume:        m.volume,
            bitrate:       m.bitrate || 0,
            repeatMode:    m.repeatMode  || 0,
            shuffleMode:   m.shuffleMode || 0,
            nowPlaying: item ? {
              id:         item.id,
              catalogId:  item.attributes.playParams?.catalogId || '',
              title:      item.attributes.name,
              artist:     item.attributes.artistName,
              album:      item.attributes.albumName,
              artworkURL: item.attributes.artwork
                ? MusicKit.formatArtworkURL(item.attributes.artwork, 300, 300) : '',
              durationMs: item.attributes.durationInMillis,
            } : null,
          };
          goPlayerStateChange(JSON.stringify(state)).catch(console.error);
        }

        // Deduplicated version for polling — only sends when state differs.
        function notifyStateIfChanged() {
          const m = _m();
          const item = m.nowPlayingItem;
          const currentTime = m.currentPlaybackTime;
          const snap = m.isPlaying + '|' + m.playbackState + '|' + Math.floor(currentTime) + '|' +
            (item ? item.id : '') + '|' + m.volume + '|' + m.repeatMode + '|' + m.shuffleMode;
          if (snap === _lastStateJSON) return;
          _lastStateJSON = snap;
          notifyState();
        }

        music.addEventListener('playbackStateDidChange',  notifyState);
        music.addEventListener('nowPlayingItemDidChange', notifyState);

        // Poll position every 200 ms so the TUI timer advances and transitions
        // (completed → loading → playing) reach Go without delay.
        setInterval(notifyStateIfChanged, 200);

        // Shorthand: send a debug-only log entry (never shown in status bar).
        const _stateN = ['none','loading','playing','paused','stopped','ended','seekFwd','seekBwd','waiting','completed','completed'];
        const _log = (msg) => goLog(msg).catch(() => {});

        // Log track changes with ID so we can correlate with doPlay logs.
        music.addEventListener('nowPlayingItemDidChange', () => {
          const item = _m().nowPlayingItem;
          if (item) _log(`[js:track] "${item.attributes?.name||'?'}" (${item.id})`);
          else       _log('[js:track] — none');
        });

        // ─── Chrome-mode queue tracker ───────────────────────────────────────
        // _q[]  = source of truth for all queued songs
        // _qi   = index of the currently playing item in _q
        //
        // There are two modes, and exactly one of them owns advancement:
        //
        //   native:   one setQueue({items:[...]}) builds the whole queue, mixing
        //             catalog and library items freely, and MusicKit advances,
        //             repeats and shuffles it by itself. Navigation is
        //             skipToNextItem / skipToPreviousItem; new songs go through
        //             playLater().
        //   one-item: setQueue({...}) per track, vibez advances on `completed`.
        //             This is the recovery mode. It is the only mode that sees a
        //             per-item failure, so it is the only one that can run the
        //             CONTENT_UNAVAILABLE to library-copy fallback.
        //
        // Two separate facts, deliberately not one flag:
        //
        //   _nativeQueue   — MusicKit holds a multi-item queue and is the sole
        //                    advance authority. Only setQueue or stop() can take
        //                    that back, so clearing this flag without one of them
        //                    does not stop MusicKit advancing: it just adds a
        //                    second advancer and both fire at the next boundary.
        //   _nativeMirrors — _q[i] is still MusicKit's queue item i for every i
        //                    it holds. Shuffle and reorder break this while
        //                    authority stays with MusicKit, which is why the two
        //                    cannot be the same flag.
        //
        // Why native mode exists. Measured with the #96 probe on MusicKit
        // 3.2526.0-prerelease.x, from the media element's own currentTime at a
        // 50 ms poll. Every arm is two items over the same track pair, with the
        // order rotated each pass so queue length and position cannot pose as a
        // difference between designs:
        //
        //   arm                         n   median     range       single src
        //   rebuild (one item/track)   11   700.0 ms   451-1000      0/11
        //   items: catalog + library   11    23.7 ms   15-37        11/11
        //   items: 2 catalog            6   350.0 ms   11-450        1/6
        //
        // The media-element src count is the invariant here, not any of those
        // medians: one src is always under 40 ms, two are always over 300. A
        // rebuild cannot start decoding the next track until the current one
        // releases the element, so it always pays for a swap. A native queue
        // never swaps, so there is nothing to wait for.
        //
        // Two caveats outlived the measurement, and both belong to #96 rather
        // than to this code. An all-catalog items: queue was the worst native
        // arm, and nothing explains why a library item in second position is the
        // most consistent thing measured. Queue length also moves the figure on
        // its own: the songs: form gave 26.5 ms at two items and 350.2 ms at
        // three. So the shipped queue shape needs its own measurement before any
        // of these numbers is quoted as this player's behaviour.

        let _q       = [];    // resolved items from the Apple Music API
        let _qi      = -1;    // index of the currently playing item (-1 = nothing)
        let _busy    = false; // guard: only one _buildAndPlay running at a time
        let _wantIdx = -1;    // pending explicit-jump target; -1 = none
        let _wantNative = false; // pending jump should rebuild the native queue
        let _libMap  = {};    // catalog ID → library song ID, for CONTENT_UNAVAILABLE fallback
        let _nativeQueue   = false; // MusicKit owns advancement (see above)
        let _nativeMirrors = false; // ...and _q still mirrors its queue order

        // Items dropped from _q while MusicKit still holds them in its native
        // queue. The removal is honoured by skipping the item the moment it
        // starts, which needs no MusicKit queue-mutation API at all.
        //
        // The #96 probe found queue.remove does work on a live queue (and
        // queue.append throws TypeError, which is why appends go through the
        // instance-level playLater). Using it would be more direct, but MusicKit
        // logs it as deprecated, so skip-on-arrival is the safer bet until a
        // supported replacement exists.
        let _removedIds = new Set();

        // The user's library copies of the queue's catalog songs, keyed by
        // library ID. _libMap records which library ID belongs to which catalog
        // song while resolving; this holds the resolved objects for them.
        //
        // Native mode is why they are fetched ahead of being needed. MusicKit
        // advances by itself there, so a failing item has no call site to throw
        // at the way _doPlayAt has one, and the recovery is to hand the index
        // back to one-item mode. That is only cheap if the substitute is already
        // in hand.
        let _libItems = {};

        // Warm _libItems for everything currently in _q. Deliberately not
        // awaited: it must not add latency to the first play, and the earliest
        // boundary that could want it is a whole track away.
        function _warmLibItems() {
          const wanted = [...new Set(_q.map(item => _libMap[item.id])
                                       .filter(id => id && !_libItems[id]))];
          if (wanted.length === 0) return;
          const batchSize = 100;
          for (let i = 0; i < wanted.length; i += batchSize) {
            const batch = wanted.slice(i, i + batchSize);
            _m().api.music('/v1/me/library/songs', { ids: batch })
              .then(r => {
                for (const song of r?.data?.data ?? []) _libItems[song.id] = song;
                _log(`[js:libwarm] cached ${batch.length} library copy(s)`);
              })
              // Not an error path: _libraryFallback still fetches on demand.
              .catch(e => _log(`[js:libwarm] skipped (${errName(e)})`));
          }
        }

        function _syncQueueIndex() {
          if (!_nativeQueue) return;
          const id = _m().nowPlayingItem?.id;
          if (!id) return;
          const idx = _q.findIndex(item => item.id === id);
          if (idx >= 0) { _qi = idx; return; }
          // Playing something that is no longer in _q — it was removed while
          // MusicKit still had it queued. Honour the removal now.
          if (_removedIds.has(id)) {
            _log(`[js:sync] removed item ${id} started — skipping it`);
            const m = _m();
            if (_nativeHasNext(m)) m.skipToNextItem().catch(() => {});
            // Nothing to skip to: it was the last item MusicKit held, so end the
            // queue rather than let a removed track play it out.
            else { _nativeQueue = false; m.stop().catch(() => {}); }
          }
        }
        music.addEventListener('nowPlayingItemDidChange', _syncQueueIndex);

        // Native mode's blind spot. MusicKit advances on its own there, so an
        // item that turns out to be unavailable mid-queue never reaches a
        // try/catch: _doPlayAt's per-item handling only sees the item it was
        // asked to play. Hand the index back to one-item mode, which does have
        // the CONTENT_UNAVAILABLE to library-copy path, and let it recover.
        //
        // Written from the event surface, not measured: the #96 probes never
        // provoked a failure inside a live native queue, so whether MusicKit
        // reports one this way is still open. It costs nothing if the event
        // never fires, and without it a bad item would strand the queue where
        // one-item mode would have skipped past it.
        music.addEventListener('mediaPlaybackError', (e) => {
          if (!_nativeQueue) return;
          const idx = _qi >= 0 ? _qi : 0;
          _log(`[js:native] playback error (${errName(e?.detail ?? e)}) at #${idx}, recovering in one-item mode`);
          _nativeQueue   = false;
          _nativeMirrors = false;
          // stop() rather than leaving it to _playAt's setQueue: if a build is
          // already in flight, _playAt only records _wantIdx and returns, and
          // MusicKit would keep advancing an abandoned queue in the meantime.
          // That is the two-advancer state the flags above exist to prevent.
          _m().stop().catch(() => {});
          _playAt(idx);
        });

        // Does MusicKit have somewhere to go on its own when the current item
        // completes?  Asked of MusicKit's queue rather than _qi so the answer
        // cannot depend on whether nowPlayingItemDidChange or the completed
        // event fires first.  Unknown queue shape → false, so vibez takes over.
        function _nativeHasNext(m) {
          if (m.repeatMode === 1 || m.repeatMode === 2) return true; // repeats itself
          const q = m.queue;
          if (!q || typeof q.length !== 'number' || typeof q.position !== 'number') return false;
          return q.position < q.length - 1;
        }

        // Run a jump that arrived while a build was in flight. The native flag
        // travels with the index so a deferred setQueue does not silently
        // downgrade itself to one-item mode.
        function _runPending() {
          if (_wantIdx < 0 || _wantIdx >= _q.length) return;
          const next   = _wantIdx;
          const native = _wantNative;
          _wantIdx    = -1;
          _wantNative = false;
          if (native) _doPlayNativeAt(next);
          else        _doPlayAt(next);
        }

        // Share one start operation across keyboard, media-session and queue callers.
        // MusicKit may already be playing after setQueue/changeToMediaAtIndex.
        let _playPending = null;
        async function _ensurePlaying(m) {
          if (_playPending) return _playPending;
          if (m.playbackState === 2) return;
          _playPending = Promise.resolve().then(async () => {
            if (m.playbackState === 2) return;
            // Normalize transitional states without stop(), which resets position.
            if (![3, 4].includes(m.playbackState)) await m.pause();
            await m.play();
          });
          try { await _playPending; }
          finally { _playPending = null; }
        }

        // Build the whole native queue once, so MusicKit advances without a
        // setQueue/play round trip — and without a media-element src swap — at
        // every boundary. See the measurements above the flag declarations.
        async function _doPlayNativeAt(startIdx) {
          const m = _m();
          _busy = true;
          _wantIdx = -1;
          _wantNative = false;
          _removedIds = new Set(); // the queue about to be built is authoritative
          try {
            await _stopAndWait(m);
            // items: rather than songs: so one descriptor covers both kinds and
            // a pre-resolved library copy can be dropped straight in. Copied,
            // because _q keeps being mutated underneath a live queue.
            await m.setQueue({ items: _q.slice() });
            _warmLibItems();
            if (startIdx > 0) await m.changeToMediaAtIndex(startIdx);
            _qi = startIdx;
            _nativeQueue   = true;
            _nativeMirrors = true;
            await _ensurePlaying(m);
            _log(`[js:native] playing ${_q.length} item(s) from #${startIdx}`);
          } catch(e) {
            _nativeQueue   = false;
            _nativeMirrors = false;
            _log(`[js:native] unavailable (${errName(e)}) → one-item fallback`);
            _wantIdx = startIdx;
          } finally {
            _busy = false;
            _runPending();
          }
        }

        // Same _busy discipline as _playAt: a build already in flight would
        // otherwise have its setQueue interleaved with ours, which is exactly
        // what desyncs _q from MusicKit's queue.
        function _playNativeAt(idx) {
          if (_busy) {
            _log(`[js:native] busy → queue #${idx}`);
            _wantIdx    = idx;
            _wantNative = true;
            return;
          }
          _doPlayNativeAt(idx);
        }

        // Resolve a mixed array of catalog + library IDs → MediaItem objects.
        // Catalog songs are fetched with include=library so we can cache the
        // user's library copy ID for each matched song — used as a fallback when
        // a catalog track is region-locked (CONTENT_UNAVAILABLE).
        async function _resolveItems(allIds) {
          const catalogIds = allIds.filter(id => !id.startsWith('i.'));
          const libraryIds = allIds.filter(id =>  id.startsWith('i.'));
          const sf = _m().storefrontId || 'us';
          let items = [];
          const batchSize = 100;

          if (catalogIds.length > 0) {
            const batches = [];
            for (let i = 0; i < catalogIds.length; i += batchSize) {
              batches.push(catalogIds.slice(i, i + batchSize));
            }
            const results = await Promise.all(batches.map(async (batch) => {
              try {
                const r = await _m().api.music(`/v1/catalog/${sf}/songs`, { ids: batch, include: 'library' });
                const songs = r?.data?.data ?? [];
                for (const song of songs) {
                  const libId = song.relationships?.library?.data?.[0]?.id;
                  if (libId) _libMap[song.id] = libId;
                }
                const playable = songs.filter(s => {
                  const pp = s.attributes?.playParams;
                  return pp && pp.id && pp.kind === 'song';
                });
                const dropped = songs.length - playable.length;
                if (dropped > 0) _log(`[js:resolve] dropped ${dropped} non-playable song(s)`);
                return playable;
              } catch(e) {
                if (isAuthError(e)) { goNeedsAuth('expired').catch(()=>{}); }
                else { goError('[resolve] catalog batch: '+errName(e)).catch(()=>{}); }
                return [];
              }
            }));
            for (const res of results) {
              items = items.concat(res);
            }
          }

          if (libraryIds.length > 0) {
            const batches = [];
            for (let i = 0; i < libraryIds.length; i += batchSize) {
              batches.push(libraryIds.slice(i, i + batchSize));
            }
            const results = await Promise.all(batches.map(async (batch) => {
              try {
                const r = await _m().api.music('/v1/me/library/songs', { ids: batch });
                return r && r.data && r.data.data ? r.data.data : [];
              } catch(e) {
                if (isAuthError(e)) { goNeedsAuth('expired').catch(()=>{}); }
                else { goError('[resolve] library batch: '+errName(e)).catch(()=>{}); }
                return [];
              }
            }));
            for (const res of results) {
              items = items.concat(res);
            }
          }

          const itemMap = {};
          for (const item of items) {
            itemMap[item.id] = item;
          }
          const orderedItems = [];
          for (const id of allIds) {
            const matched = itemMap[id];
            if (matched) {
              orderedItems.push(matched);
            }
          }
          return orderedItems;
        }

        // Wait (event-driven) for MusicKit to leave a mid-seek state before
        // calling setQueue.  Only seekFwd(6) and seekBwd(7) cause spurious
        // CONTENT_EQUIVALENT errors on setQueue; all other states (playing,
        // paused, completed, none, stopped) are safe to proceed immediately.
        // 200 ms cap prevents hanging if the event never fires.
        function _stopAndWait(m) {
          const seeking = [6, 7]; // seekFwd, seekBwd
          if (!seeking.includes(m.playbackState)) return Promise.resolve();
          return new Promise(resolve => {
            const handler = () => {
              if (!seeking.includes(m.playbackState)) {
                m.removeEventListener('playbackStateDidChange', handler);
                clearTimeout(t);
                resolve();
              }
            };
            const t = setTimeout(() => {
              m.removeEventListener('playbackStateDidChange', handler);
              resolve();
            }, 200);
            m.addEventListener('playbackStateDidChange', handler);
          });
        }

        // Try the user's library copy of _q[idx] as a fallback when a catalog
        // track is unavailable (CONTENT_UNAVAILABLE), region-locked
        // (CONTENT_EQUIVALENT), or restricted (CONTENT_RESTRICTED).
        // Library items bypass storefront and account restrictions.
        // On success: swap _q[idx] and schedule a retry.
        // On failure: skip silently to the next track.
        async function _libraryFallback(idx, item) {
          if (item.id.startsWith('i.')) {
            // Already using a library item and still failing — nothing left to try.
            _log(`[js:doPlay] library item still failing → skip #${idx+1}`);
            goSkipped(item.id).catch(() => {});
            if (idx + 1 < _q.length) _wantIdx = idx + 1;
            return;
          }
          const libId = _libMap[item.id];
          _log(`[js:doPlay] fallback libId=${libId||'none'}`);
          if (libId) {
            if (_libItems[libId]) {
              _log(`[js:doPlay] library swap OK (warmed) → retry #${idx}`);
              _q[idx]  = _libItems[libId];
              _wantIdx = idx; // retry via finally
              return;
            }
            try {
              const r = await _m().api.music('/v1/me/library/songs', { ids: [libId] });
              const lib = r?.data?.data ?? [];
              if (lib.length > 0) {
                _log(`[js:doPlay] library swap OK → retry #${idx}`);
                _libItems[libId] = lib[0];
                _q[idx]  = lib[0];

            const libraryIds = allIds.filter(id =>  id.startsWith('i.'));
            const sf = m.storefrontId || 'us';

            if (allIds.length === 0) { goError('appendQueue: empty id list').catch(() => {}); return; }

            let items = [];
            if (catalogIds.length > 0) {
              try {
                const resp = await m.api.music(`/v1/catalog/${sf}/songs`, { ids: catalogIds });
                items = resp && resp.data && resp.data.data ? resp.data.data : [];
              } catch(e) { goError(`[queue] catalog API failed: ${errName(e)}`).catch(() => {}); }
            }
            if (items.length === 0 && libraryIds.length > 0) {
              try {
                const resp = await m.api.music('/v1/me/library/songs', { ids: libraryIds });
                items = resp && resp.data && resp.data.data ? resp.data.data : [];
              } catch(e) { goError(`[queue] library API failed: ${errName(e)}`).catch(() => {}); }
            }
            if (items.length === 0) { _log('[js:append] no items resolved — skip'); return; }

            const wasEmpty = _queue.length === 0;
            _queue = _queue.concat(items);
            if (wasEmpty) playIdx(0);
          } catch(e) { goError('appendQueue failed: ' + errName(e)).catch(() => {}); }
        };

        // vibez owns this queue outright, so append-then-move is exact here.
        window.vibezQueuePlayNext = async function(idsJSON) {
          const before = _queue.length;
          const at     = _idx + 1;
          await window.vibezAppendQueue(idsJSON);
          if (before === 0) return; // the append started playback at item 0
          for (let i = before; i < _queue.length; i++) window.vibezQueueMove(i, at + (i - before));
        };

        window.vibezQueueRemove = function(idxStr) {
          const idx = parseInt(idxStr);
          if (idx < 0 || idx >= _queue.length) return;
          _queue.splice(idx, 1);
          if (idx < _idx)       _idx--;
          else if (idx === _idx) {
            if (_queue.length === 0) { _idx = -1; return; }
            if (_idx >= _queue.length) _idx = _queue.length - 1;
            playIdx(_idx);
          }
        };

        window.vibezQueueMove = function(fromStr, toStr) {
          const from = parseInt(fromStr);
          const to   = parseInt(toStr);
          if (from < 0 || from >= _queue.length || to < 0 || to >= _queue.length || from === to) return;
          const item = _queue.splice(from, 1)[0];
          _queue.splice(to, 0, item);
          if (_idx === from)                  _idx = to;
          else if (from < _idx && to >= _idx) _idx--;
          else if (from > _idx && to <= _idx) _idx++;
        };

        window.vibezQueueClear = function() {
          _queue = [];
          _idx   = -1;
        };
      }

      // ── Auth (both modes) ────────────────────────────────────────────────
      // savedToken is already declared above and musicUserToken pre-set.
      // If a token exists, skip music.authorize() — in headless Chrome it
      // opens an invisible OAuth popup that hangs forever. Use the token
      // directly; if it's expired, API calls will fail and we handle it then.
      if (savedToken !== '') {
        const sf = music.storefrontId || '(unknown)';
        await goStorefrontChanged(sf).catch(() => {});
        await goLog(`[init] storefront=${sf} configured={{.Storefront}} musickit=${MusicKit.version||'?'} restricted=${music.restrictedEnabled} token=saved`).catch(() => {});
        await goAuthComplete('done').catch(() => {});
      } else {
        // No saved token: need interactive auth (Chrome window is visible).
        try {
          await goNeedsAuth('pending').catch(() => {});
          const token = await music.authorize();
          await goUserTokenChanged(token || '').catch(() => {});
          const sf = music.storefrontId || '(unknown)';
          await goStorefrontChanged(sf).catch(() => {});
          await goLog(`[init] storefront=${sf} configured={{.Storefront}} musickit=${MusicKit.version||'?'} restricted=${music.restrictedEnabled} token=new`).catch(() => {});
          await goAuthComplete('done').catch(() => {});
        } catch(e) {
          goError('auth failed: ' + (e.message || String(e))).catch(() => {});
          return;
        }
      }

    } catch(e) {
      goError(e.message || String(e)).catch(console.error);
    }
  });
  </script>
  <script src="https://js-cdn.music.apple.com/musickit/v3/musickit.js"
          onerror="if(typeof goError==='function'){goError('MusicKit.js failed to load from CDN').catch(function(){});}"></script>
