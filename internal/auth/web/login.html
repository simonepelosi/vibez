<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>vibez — Connect Apple Music</title>
  <style nonce="{{.Nonce}}">
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #1a1b26;
      color: #c0caf5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #24283b;
      border: 1px solid #414868;
      border-radius: 16px;
      padding: 44px 48px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 24px 64px rgba(0,0,0,0.55);
    }
    .bear {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 1.15rem;
      color: #e5c07b;
      margin-bottom: 10px;
      letter-spacing: 1px;
    }
    .logo {
      font-size: 2.2rem;
      font-weight: 700;
      color: #c678dd;
      margin-bottom: 6px;
      letter-spacing: 1.5px;
    }
    .subtitle {
      color: #787c99;
      font-size: 0.9rem;
      margin-bottom: 32px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #c678dd;
      color: #1a1b26;
      border: 2px solid transparent;
      border-radius: 10px;
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.18s, transform 0.1s, border-color 0.18s;
      width: 100%;
      justify-content: center;
      outline: none;
    }
    .btn:hover { background: #d48ee8; }
    .btn:focus-visible { border-color: #e5c07b; box-shadow: 0 0 0 3px rgba(229,192,123,0.25); }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { background: #313244; color: #5c6370; cursor: not-allowed; }
    .kbd-hint {
      margin-top: 12px;
      font-size: 0.8rem;
      color: #787c99;
    }
    .kbd-key {
      color: #e5c07b;
      font-weight: 600;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .status {
      margin-top: 20px;
      font-size: 0.9rem;
      min-height: 22px;
      color: #a6e3a1;
    }
    .status.error { color: #f38ba8; }
    .success-box {
      display: none;
      margin-top: 20px;
      background: #1e2a24;
      border: 1px solid #a6e3a1;
      border-radius: 10px;
      padding: 18px 20px;
      text-align: left;
    }
    .success-box h3 { color: #a6e3a1; margin-bottom: 6px; font-size: 1rem; }
    .success-box p { color: #c0caf5; font-size: 0.88rem; line-height: 1.5; }
    .manual-details {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid #32374d;
      text-align: left;
      font-size: 0.82rem;
      color: #787c99;
    }
    .manual-details summary {
      cursor: pointer;
      color: #7aa2f7;
      user-select: none;
      font-weight: 500;
    }
    .manual-row {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    .manual-input {
      flex: 1;
      background: #1a1b26;
      border: 1px solid #414868;
      border-radius: 8px;
      color: #c0caf5;
      padding: 9px 12px;
      font-size: 0.85rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      outline: none;
    }
    .manual-input:focus { border-color: #7aa2f7; }
    .manual-btn {
      background: #3b4261;
      color: #c0caf5;
      border: 1px solid #565f89;
      border-radius: 8px;
      padding: 9px 14px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }
    .manual-btn:hover { background: #464f73; }
  </style>
</head>
<body>
  <div class="card">
    <div class="bear">ʕ•ᴥ•ʔ</div>
    <div class="logo">♪ vibez</div>
    <div class="subtitle">vibe-driven music player for your terminal</div>

    <button class="btn" id="connectBtn" type="button">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/>
      </svg>
      <span id="btnLabel">Connect Apple Music</span>
    </button>
    <div class="kbd-hint" id="kbdHint">Press <span class="kbd-key">Enter</span> or click to open Apple Music sign-in</div>

    <div class="status" id="status"></div>

    <div class="success-box" id="successBox">
      <h3>✓ Connected!</h3>
      <p>vibez is now linked to your Apple Music account.<br/>
         Return to your terminal — the app will continue automatically.</p>
    </div>

    <details class="manual-details" id="manualDetails">
      <summary>Paste token manually (SSH / headless / custom browser)</summary>
      <div class="manual-row">
        <input class="manual-input" id="manualTokenInput" type="password" placeholder="Paste media-user-token…" autocomplete="off" />
        <button class="manual-btn" id="manualSubmitBtn" type="button">Save</button>
      </div>
    </details>
  </div>

  <script nonce="{{.Nonce}}">
    const developerToken = "{{.DeveloperToken}}";
    const callbackState = "{{.State}}";
    const authorizeOrigin = "https://authorize.music.apple.com";

    // Strip the single-use ?state= parameter from browser history immediately.
    if (window.history && window.history.replaceState) {
      window.history.replaceState(null, "", window.location.pathname);
    }

    function requestAppleMusicUserToken() {
      const thirdPartyInfo = JSON.stringify({
        thirdPartyName: window.location.host || "vibez",
        thirdPartyToken: developerToken,
      });
      const params = new URLSearchParams({
        a: btoa(thirdPartyInfo),
        referrer: window.location.origin + window.location.pathname,
      });
      const popupURL = `${authorizeOrigin}/woa?${params.toString()}`;
      const width = 650, height = 650;
      const left = Math.max(0, Math.round((window.screenX || 0) + ((window.outerWidth || width) - width) / 2));
      const top = Math.max(0, Math.round((window.screenY || 0) + ((window.outerHeight || height) - height) / 2));
      const features = `width=${width},height=${height},left=${left},top=${top},menubar=no,resizable=no,scrollbars=no,status=no,toolbar=no`;

      return new Promise((resolve, reject) => {
        const win = window.open(popupURL, "apple-music-service-view", features);
        if (!win) {
          reject(new PopupBlockedError("Popup blocked by browser — allow popups for localhost and try again"));
          return;
        }
        let settled = false;
        const cleanup = () => {
          window.removeEventListener("message", onMessage);
          clearInterval(pollTimer);
        };
        const finish = (fn, val) => {
          if (settled) return;
          settled = true;
          cleanup();
          fn(val);
        };
        const pollTimer = setInterval(() => {
          if (win.closed) {
            finish(reject, new Error("Authorization window closed"));
          }
        }, 500);

        function onMessage(event) {
          if (event.origin !== authorizeOrigin || event.source !== win) return;
          const data = event.data;
          if (!data || data.jsonrpc !== "2.0" || !data.method) return;
          const reply = (result) => {
            try {
              win.postMessage({ jsonrpc: "2.0", id: data.id, result }, authorizeOrigin);
            } catch (_) {}
          };
          const paramsArr = Array.isArray(data.params) ? data.params : [];
          switch (data.method) {
            case "thirdPartyInfo":
              reply(thirdPartyInfo);
              break;
            case "authorize": {
              const token = paramsArr[0];
              reply({});
              if (typeof token === "string" && token.length > 0) {
                finish(resolve, token);
              } else {
                finish(reject, new Error("Authorization failed"));
              }
              break;
            }
            case "decline":
              reply({});
              finish(reject, new Error("Authorization declined"));
              break;
            case "unavailable":
              reply({});
              finish(reject, new Error("Apple Music authorization unavailable"));
              break;
            case "close":
            case "switchUserId":
              reply({});
              break;
          }
        }
        window.addEventListener("message", onMessage);
      });
    }

    class PopupBlockedError extends Error {}

    async function submitUserToken(userToken) {
      const btn = document.getElementById("connectBtn");
      const btnLabel = document.getElementById("btnLabel");
      const status = document.getElementById("status");
      status.className = "status";
      status.textContent = "Sending token to vibez…";
      const resp = await fetch("/callback", {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-Vibez-State": callbackState },
        body: JSON.stringify({ user_token: userToken }),
      });
      if (!resp.ok) {
        throw new Error("Server returned " + resp.status);
      }
      status.textContent = "";
      document.getElementById("kbdHint").style.display = "none";
      document.getElementById("manualDetails").style.display = "none";
      document.getElementById("successBox").style.display = "block";
      btn.disabled = true;
      btnLabel.textContent = "Connected ✓";
      setTimeout(() => {
        try { window.close(); } catch (_) {}
      }, 1500);
    }

    async function connectAppleMusic(autoStart = false) {
      const btn = document.getElementById("connectBtn");
      const btnLabel = document.getElementById("btnLabel");
      const status = document.getElementById("status");

      btn.disabled = true;
      btnLabel.textContent = "Connecting…";
      status.className = "status";
      status.textContent = "Waiting for Apple Music authorization…";

      try {
        const userToken = await requestAppleMusicUserToken();
        await submitUserToken(userToken);
      } catch (err) {
        if (autoStart && err instanceof PopupBlockedError) {
          status.className = "status";
          status.textContent = "";
          btn.disabled = false;
          btnLabel.textContent = "Connect Apple Music";
          btn.focus();
          return;
        }
        status.className = "status error";
        status.textContent = "Error: " + (err.message || String(err));
        btn.disabled = false;
        btnLabel.textContent = "Try Again";
        btn.focus();
      }
    }

    async function submitManualToken() {
      const input = document.getElementById("manualTokenInput");
      const status = document.getElementById("status");
      const token = (input.value || "").trim();
      if (!token) {
        status.className = "status error";
        status.textContent = "Please paste a valid media-user-token first";
        input.focus();
        return;
      }
      try {
        await submitUserToken(token);
      } catch (err) {
        status.className = "status error";
        status.textContent = "Error: " + (err.message || String(err));
      }
    }

    document.getElementById("connectBtn").addEventListener("click", () => {
      connectAppleMusic(false);
    });
    document.getElementById("manualSubmitBtn").addEventListener("click", () => {
      submitManualToken();
    });
    document.getElementById("manualTokenInput").addEventListener("keydown", (ev) => {
      if (ev.key === "Enter") {
        ev.preventDefault();
        submitManualToken();
      }
    });
    window.addEventListener("DOMContentLoaded", () => {
      const btn = document.getElementById("connectBtn");
      if (navigator.userActivation && !navigator.userActivation.isActive) {
        btn.focus();
        return;
      }
      connectAppleMusic(true);
    });
  </script>
</body>
</html>
