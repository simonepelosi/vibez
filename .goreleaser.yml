version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: vibez-linux
    binary: vibez
    # Set to 1 by the darwin release job, which runs this same config on a
    # macOS runner and cannot build the Linux GStreamer CGO target.
    skip: '{{ eq (index .Env "VIBEZ_SKIP_LINUX") "1" }}'
    ldflags:
      - -s -w
      - -X 'github.com/simone-vibes/vibez/internal/version.Version={{ .Version }}'
      - -X 'github.com/simone-vibes/vibez/internal/auth.tokenURL={{ .Env.VIBEZ_TOKEN_URL }}'
      - -X 'github.com/simone-vibes/vibez/internal/auth.clientKey={{ .Env.VIBEZ_CLIENT_KEY }}'
    env:
      - CGO_ENABLED=1
      - GOTOOLCHAIN=local
    goos:
      - linux
    goarch:
      - amd64
      # linux/arm64 is not published here yet: this CGO/GStreamer build needs
      # an aarch64 toolchain (CC=aarch64-linux-gnu-gcc + arm64 GStreamer) or a
      # native arm64 runner. Until then arm64 users build from source with
      # `make build`.

  - id: vibez-darwin
    binary: vibez
    # Set to 1 by the linux release job. Darwin is built on a macOS runner so
    # that CGO_ENABLED=1 below has a working clang and the macOS SDK; the two
    # jobs each skip the other's target.
    skip: '{{ eq (index .Env "VIBEZ_SKIP_DARWIN") "1" }}'
    ldflags:
      - -s -w
      - -X 'github.com/simone-vibes/vibez/internal/version.Version={{ .Version }}'
      - -X 'github.com/simone-vibes/vibez/internal/auth.tokenURL={{ .Env.VIBEZ_TOKEN_URL }}'
      - -X 'github.com/simone-vibes/vibez/internal/auth.clientKey={{ .Env.VIBEZ_CLIENT_KEY }}'
    env:
      - CGO_ENABLED=1
      - GOTOOLCHAIN=local
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    overrides:
      # macos-latest is arm64, so darwin/amd64 is a cgo cross-compile and clang
      # has to be told which architecture to emit. Only the compiler vars belong
      # here: this env is merged into the build's rather than replacing it, so
      # CGO_ENABLED=1 above still reaches the amd64 target.
      - goos: darwin
        goarch: amd64
        env:
          - CC=clang -arch x86_64
          - CXX=clang++ -arch x86_64

  - id: vibez-windows
    binary: vibez
    # Cross-compiled by the Linux release job with MinGW: the native browserless
    # engine is a C++ CDM bridge plus a Media Foundation sink, so this is a cgo
    # build. The runtime is linked statically (see the #cgo directives), leaving
    # vibez.exe with imports only of DLLs every Windows install has.
    skip: '{{ eq (index .Env "VIBEZ_SKIP_WINDOWS") "1" }}'
    ldflags:
      - -s -w
      - -X 'github.com/simone-vibes/vibez/internal/version.Version={{ .Version }}'
      - -X 'github.com/simone-vibes/vibez/internal/auth.tokenURL={{ .Env.VIBEZ_TOKEN_URL }}'
      - -X 'github.com/simone-vibes/vibez/internal/auth.clientKey={{ .Env.VIBEZ_CLIENT_KEY }}'
    env:
      - CGO_ENABLED=1
      - CC=x86_64-w64-mingw32-gcc
      - CXX=x86_64-w64-mingw32-g++
      - GOTOOLCHAIN=local
    goos:
      - windows
    goarch:
      - amd64

archives:
  - id: vibez
    ids:
      - vibez-linux
      - vibez-darwin
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    # Setting files replaces GoReleaser's default list, so the three it adds on
    # its own are restated. The desktop file and icon let a distro package
    # (#53) install everything from this one archive; they are the same two
    # files the install script and the Flatpak manifest already ship.
    files:
      - LICENSE*
      - README*
      - CHANGELOG*
      - flatpak/io.github.simonepelosi.vibez.desktop
      - assets/logo.png

  - id: vibez-windows
    ids:
      - vibez-windows
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - zip
    files:
      - LICENSE*
      - README*
      - CHANGELOG*

checksum:
  name_template: "checksums.txt"
  algorithm: sha256
  # Darwin archives are built on the macOS job and handed to this one as
  # ./dist-darwin, outside the dist/ that --clean wipes.
  extra_files:
    - glob: ./dist-darwin/*.tar.gz

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: simonepelosi
    name: vibez
  draft: false
  prerelease: auto
  replace_existing_artifacts: true
  extra_files:
    - glob: ./dist-darwin/*.tar.gz
