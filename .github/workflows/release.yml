name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Darwin is built here rather than in the release job below because its
  # native backends are CGO: a macOS runner is the only place clang and the
  # macOS SDK are available. The archives are handed to the release job, which
  # attaches them to the same release via extra_files.
  darwin:
    name: build-darwin
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Check token broker configuration
        env:
          VIBEZ_TOKEN_URL: ${{ vars.VIBEZ_TOKEN_URL }}
          VIBEZ_CLIENT_KEY: ${{ secrets.VIBEZ_CLIENT_KEY }}
        run: |
          # Without these a build has no developer token and cannot reach Apple Music.
          [ -n "$VIBEZ_TOKEN_URL" ] || { echo "VIBEZ_TOKEN_URL repository variable is not set"; exit 1; }
          [ -n "$VIBEZ_CLIENT_KEY" ] || { echo "VIBEZ_CLIENT_KEY secret is not set"; exit 1; }

      - name: Build darwin archives
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: '~> v2'
          args: release --clean --skip=publish
        env:
          VIBEZ_TOKEN_URL: ${{ vars.VIBEZ_TOKEN_URL }}
          VIBEZ_CLIENT_KEY: ${{ secrets.VIBEZ_CLIENT_KEY }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
          VIBEZ_SKIP_LINUX: '1'
          VIBEZ_SKIP_WINDOWS: '1'
          GOTOOLCHAIN: local

      - name: Upload darwin archives
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: darwin-archives
          path: dist/*.tar.gz
          if-no-files-found: error
          # Consumed by the next job; the same bytes ship on the release.
          retention-days: 1

  release:
    name: release
    needs: darwin
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y --fix-missing libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev g++-mingw-w64-x86-64

      - name: Download darwin archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: darwin-archives
          path: dist-darwin

      - name: Check darwin archives
        run: |
          # extra_files globs quietly when nothing matches, so without this the
          # release would publish with no macOS binaries and no error anywhere.
          for arch in amd64 arm64; do
            f="dist-darwin/vibez_darwin_${arch}.tar.gz"
            [ -s "$f" ] || { echo "missing $f"; exit 1; }
            tar tzf "$f" | grep -qx vibez || { echo "$f contains no vibez binary"; exit 1; }
          done
          ls -l dist-darwin

      - name: Extract CHANGELOG entry
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Extracts the section for VERSION from CHANGELOG.md without regex interpolation.
          # Expected format: "## [X.Y.Z] — YYYY-MM-DD" headers.
          awk -v hdr="## [${VERSION}]" 'index($0, hdr) == 1 {found=1; next} found && index($0, "## [") == 1 {exit} found' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "No CHANGELOG entry found for version ${VERSION}" > release_notes.md
          fi

      - name: Check token broker configuration
        env:
          VIBEZ_TOKEN_URL: ${{ vars.VIBEZ_TOKEN_URL }}
          VIBEZ_CLIENT_KEY: ${{ secrets.VIBEZ_CLIENT_KEY }}
        run: |
          # Without these a build has no developer token and cannot reach Apple Music.
          [ -n "$VIBEZ_TOKEN_URL" ] || { echo "VIBEZ_TOKEN_URL repository variable is not set"; exit 1; }
          [ -n "$VIBEZ_CLIENT_KEY" ] || { echo "VIBEZ_CLIENT_KEY secret is not set"; exit 1; }

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: '~> v2'
          args: release --clean --release-notes=release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VIBEZ_TOKEN_URL: ${{ vars.VIBEZ_TOKEN_URL }}
          VIBEZ_CLIENT_KEY: ${{ secrets.VIBEZ_CLIENT_KEY }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
          VIBEZ_SKIP_DARWIN: '1'
          GOTOOLCHAIN: local
