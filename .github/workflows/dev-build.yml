name: Dev Build

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to build (leave empty to build from main)"
        required: false
        type: string

permissions:
  contents: read
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  setup:
    name: setup
    runs-on: ubuntu-latest
    outputs:
      is_pr: ${{ steps.pr.outputs.is_pr }}
      pr_num: ${{ steps.pr.outputs.pr_num }}
      sha: ${{ steps.pr.outputs.sha }}
      ref: ${{ steps.pr.outputs.ref }}
      version: ${{ steps.pr.outputs.version }}
      name_suffix: ${{ steps.pr.outputs.name_suffix }}
    steps:
      - name: Get PR ref
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ github.event.inputs.pr_number }}
        run: |
          if [ -z "$PR_NUM" ]; then
            echo "is_pr=false" >> "$GITHUB_OUTPUT"
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "ref=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "version=dev-main-$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"
            echo "name_suffix=dev-main" >> "$GITHUB_OUTPUT"
          else
            PR_DATA=$(gh api repos/${{ github.repository }}/pulls/$PR_NUM --jq '{head_sha: .head.sha, head_ref: .head.ref, title: .title}')
            SHA=$(echo "$PR_DATA" | jq -r .head_sha)
            echo "is_pr=true" >> "$GITHUB_OUTPUT"
            echo "pr_num=$PR_NUM" >> "$GITHUB_OUTPUT"
            echo "sha=$SHA" >> "$GITHUB_OUTPUT"
            echo "ref=$(echo "$PR_DATA" | jq -r .head_ref)" >> "$GITHUB_OUTPUT"
            echo "version=dev-pr${PR_NUM}-$(echo $SHA | cut -c1-7)" >> "$GITHUB_OUTPUT"
            echo "name_suffix=dev-pr${PR_NUM}" >> "$GITHUB_OUTPUT"
          fi

  build-linux-windows:
    name: build-linux-windows
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.sha }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Check token broker configuration
        env:
          VIBEZ_TOKEN_URL: ${{ vars.VIBEZ_TOKEN_URL }}
          VIBEZ_CLIENT_KEY: ${{ secrets.VIBEZ_CLIENT_KEY }}
        run: |
          [ -n "$VIBEZ_TOKEN_URL" ] || { echo "VIBEZ_TOKEN_URL repository variable is not set"; exit 1; }
          [ -n "$VIBEZ_CLIENT_KEY" ] || { echo "VIBEZ_CLIENT_KEY secret is not set"; exit 1; }

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y --fix-missing libwebkit2gtk-4.1-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev g++-mingw-w64-x86-64

      - name: Build (linux/amd64)
        env:
          VIBEZ_TOKEN_URL: ${{ vars.VIBEZ_TOKEN_URL }}
          VIBEZ_CLIENT_KEY: ${{ secrets.VIBEZ_CLIENT_KEY }}
          CGO_ENABLED: "1"
          PKG_CONFIG_PATH: ${{ github.workspace }}/pkg-config
          GOTOOLCHAIN: local
        run: |
          go build -o vibez-linux-amd64 \
            -ldflags "-s -w -X 'github.com/simone-vibes/vibez/internal/version.Version=${{ needs.setup.outputs.version }}' -X 'github.com/simone-vibes/vibez/internal/auth.tokenURL=${{ env.VIBEZ_TOKEN_URL }}' -X 'github.com/simone-vibes/vibez/internal/auth.clientKey=${{ env.VIBEZ_CLIENT_KEY }}'" \
            .

      - name: Build (windows/amd64)
        env:
          VIBEZ_TOKEN_URL: ${{ vars.VIBEZ_TOKEN_URL }}
          VIBEZ_CLIENT_KEY: ${{ secrets.VIBEZ_CLIENT_KEY }}
          # cgo: the native engine needs MinGW (a C++ CDM bridge and a Media Foundation sink).
          CGO_ENABLED: "1"
          CC: x86_64-w64-mingw32-gcc
          CXX: x86_64-w64-mingw32-g++
          GOTOOLCHAIN: local
          GOOS: windows
          GOARCH: amd64
        run: |
          go build -o vibez-windows-amd64.exe \
            -ldflags "-s -w -X 'github.com/simone-vibes/vibez/internal/version.Version=${{ needs.setup.outputs.version }}' -X 'github.com/simone-vibes/vibez/internal/auth.tokenURL=${{ env.VIBEZ_TOKEN_URL }}' -X 'github.com/simone-vibes/vibez/internal/auth.clientKey=${{ env.VIBEZ_CLIENT_KEY }}'" \
            .

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: vibez-${{ needs.setup.outputs.name_suffix }}-linux-amd64
          path: vibez-linux-amd64
          retention-days: 14

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: vibez-${{ needs.setup.outputs.name_suffix }}-windows-amd64
          path: vibez-windows-amd64.exe
          retention-days: 14

  build-darwin:
    name: build-darwin
    needs: setup
    runs-on: macos-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.sha }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Check token broker configuration
        env:
          VIBEZ_TOKEN_URL: ${{ vars.VIBEZ_TOKEN_URL }}
          VIBEZ_CLIENT_KEY: ${{ secrets.VIBEZ_CLIENT_KEY }}
        run: |
          [ -n "$VIBEZ_TOKEN_URL" ] || { echo "VIBEZ_TOKEN_URL repository variable is not set"; exit 1; }
          [ -n "$VIBEZ_CLIENT_KEY" ] || { echo "VIBEZ_CLIENT_KEY secret is not set"; exit 1; }

      - name: Build (darwin/arm64)
        env:
          VIBEZ_TOKEN_URL: ${{ vars.VIBEZ_TOKEN_URL }}
          VIBEZ_CLIENT_KEY: ${{ secrets.VIBEZ_CLIENT_KEY }}
          CGO_ENABLED: "1"
          GOOS: darwin
          GOARCH: arm64
          GOTOOLCHAIN: local
        run: |
          go build -o vibez-darwin-arm64 \
            -ldflags "-s -w -X 'github.com/simone-vibes/vibez/internal/version.Version=${{ needs.setup.outputs.version }}' -X 'github.com/simone-vibes/vibez/internal/auth.tokenURL=${{ env.VIBEZ_TOKEN_URL }}' -X 'github.com/simone-vibes/vibez/internal/auth.clientKey=${{ env.VIBEZ_CLIENT_KEY }}'" \
            .

      - name: Build (darwin/amd64)
        env:
          VIBEZ_TOKEN_URL: ${{ vars.VIBEZ_TOKEN_URL }}
          VIBEZ_CLIENT_KEY: ${{ secrets.VIBEZ_CLIENT_KEY }}
          CGO_ENABLED: "1"
          GOOS: darwin
          GOARCH: amd64
          CC: clang
          CXX: clang++
          CGO_CFLAGS: "-arch x86_64"
          CGO_CXXFLAGS: "-arch x86_64"
          CGO_LDFLAGS: "-arch x86_64"
          GOTOOLCHAIN: local
        run: |
          go build -o vibez-darwin-amd64 \
            -ldflags "-s -w -X 'github.com/simone-vibes/vibez/internal/version.Version=${{ needs.setup.outputs.version }}' -X 'github.com/simone-vibes/vibez/internal/auth.tokenURL=${{ env.VIBEZ_TOKEN_URL }}' -X 'github.com/simone-vibes/vibez/internal/auth.clientKey=${{ env.VIBEZ_CLIENT_KEY }}'" \
            .

      - name: Upload Darwin AMD64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: vibez-${{ needs.setup.outputs.name_suffix }}-darwin-amd64
          path: vibez-darwin-amd64
          retention-days: 14

      - name: Upload Darwin ARM64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: vibez-${{ needs.setup.outputs.name_suffix }}-darwin-arm64
          path: vibez-darwin-arm64
          retention-days: 14

  notify:
    name: notify
    needs: [setup, build-linux-windows, build-darwin]
    runs-on: ubuntu-latest
    if: needs.setup.outputs.is_pr == 'true'
    steps:
      - name: Comment on PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUM: ${{ needs.setup.outputs.pr_num }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh pr comment "$PR_NUM" --body "🎵 **Dev builds ready** — [\`${{ needs.setup.outputs.version }}\`]($RUN_URL)

          **Download:** Go to the [workflow run]($RUN_URL) → Artifacts:
          - \`vibez-${{ needs.setup.outputs.name_suffix }}-linux-amd64\`
          - \`vibez-${{ needs.setup.outputs.name_suffix }}-darwin-amd64\`
          - \`vibez-${{ needs.setup.outputs.name_suffix }}-darwin-arm64\` (for Apple Silicon Macs)
          - \`vibez-${{ needs.setup.outputs.name_suffix }}-windows-amd64\` (native Windows)

          <sub>Built from ${{ needs.setup.outputs.sha }} • expires in 14 days</sub>"
