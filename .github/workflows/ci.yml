name: CI

on:
  push:
    branches: ["main"]
  # No branch filter: a pull request is checked whatever it targets. Filtering
  # on main meant a PR stacked on a feature branch never ran a check at all.
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-good gstreamer1.0-libav

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit
        run: pre-commit run --all-files

  test-linux:
    name: build-vet-test-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-good gstreamer1.0-libav

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -coverprofile=coverage.out -covermode=atomic ./...

      - name: Coverage summary
        run: |
          go tool cover -func=coverage.out | tail -1 | awk '{print "Total coverage: " $3}' >> $GITHUB_STEP_SUMMARY

  test-macos:
    name: build-vet-test-macos
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Build
        run: CGO_ENABLED=0 go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Test release build mode
        run: CGO_ENABLED=0 go test ./...

  test-windows:
    name: build-vet-test-windows
    runs-on: windows-latest
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.11.4

      - name: Lint
        run: golangci-lint run --config=.golangci.yml --fix=false

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      # The browserless engine on Windows is native code (a C++ CDM bridge and a
      # Media Foundation/waveOut sink), so build and test it the way the release
      # does: cgo with the MinGW toolchain preinstalled on the runner.
      - name: Native browserless engine (cgo)
        shell: bash
        env:
          CGO_ENABLED: '1'
        run: |
          gcc --version
          go build ./...
          go vet ./internal/player/browserless/... ./internal/player/smtc/... ./cmd/...
          go test -v ./internal/player/browserless/...
          # The reader-side SMTC test skips itself where the runner cannot
          # host or read media sessions.
          go test -v ./internal/player/smtc/...
